<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formicarium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div class="app">
  <header class="top">
    <div class="brand"><h1>Formicarium</h1></div>
    <div class="clock"><span class="lab">Year</span><span id="yr" class="num">0</span></div>
    <div class="seg" role="group" aria-label="Speed"><button type="button" id="sp0">Pause</button><button type="button" id="sp1" title="About two years a second, slowing down when something big is about to happen">Watchful</button><button type="button" id="sp2" title="Four years a second">Steady</button><button type="button" id="sp3" title="Twelve years a second">Fast</button></div>
    <div class="lensrow"><span class="lab">Lens</span><div class="seg" id="lenses" role="group" aria-label="Map lens"></div></div>
    <button type="button" id="newworld">New world</button><button type="button" id="emptyworld" title="A new world with no people in it">Empty world</button>
  </header>
  <div class="stage">
    <nav class="tools" id="tools" aria-label="Powers"></nav>
    <div class="mapcol">
      <div class="jar" id="jar"><canvas id="gl"></canvas><canvas id="ov" aria-label="The world. Drag to move, scroll to zoom, or pick a power and use it on the map."></canvas>
        <div class="zoomer"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button></div>
        <p class="nogl" id="nogl" hidden>This needs WebGL2, which this browser is not offering.</p>
        <p class="nogl" id="making">Making a world…</p>
        <div class="legend" id="legend" hidden></div>
        <div class="tip" id="tip" hidden></div>
        <div class="toasts" id="toasts" aria-live="polite"></div>
        <div class="banner" id="banner" hidden role="status"><span class="bt"></span><button type="button" class="bgo">Show me</button></div>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </div>
    <aside class="side">
      <section class="card keep" aria-label="This world"><div class="keeprow" id="keeprow"><span class="lab">This world</span></div><button type="button" id="watching" class="watching" disabled></button><div id="threads" class="threads" aria-label="Story threads"></div></section>
      <section class="card" aria-label="The sky">
        <h2>The sky</h2>
        <label class="dial"><span>Sun</span><input type="range" id="d-sun" min="-35" max="35" step="0.5" value="0"><output id="o-sun">as it is</output></label>
        <label class="dial"><span>Seasons</span><input type="range" id="d-tilt" min="0" max="85" step="0.5" value="23.5"><output id="o-tilt">mild</output></label>
        <label class="dial"><span>Sea level</span><input type="range" id="d-sea" min="-0.4" max="0.4" step="0.005" value="0"><output id="o-sea">as it is</output></label>
        <label class="dial"><span>Weather</span><input type="range" id="d-mood" min="0" max="4" step="0.1" value="1"><output id="o-mood">fickle</output></label>
        <label class="dial"><span>Rainfall</span><input type="range" id="d-wet" min="0.15" max="3" step="0.05" value="1"><output id="o-wet">as it is</output></label>
        <label class="dial"><span>Greenhouse</span><input type="range" id="d-green" min="-15" max="25" step="0.5" value="0"><output id="o-green">none</output></label>
        <label class="dial"><span>Spin</span><button type="button" id="d-spin" class="mini">Eastward</button><output></output></label>
      </section>
      <section class="card" aria-label="Living things"><div class="vitals" id="vitals"></div><div class="trend"><span class="lab">People over time</span><canvas id="spark" width="600" height="80" role="img" aria-label="World population over time"></canvas></div></section>
      <section class="card inspect" id="inspect" aria-live="polite"></section>
      <section class="card book">
        <div class="tabs" role="tablist"><button type="button" role="tab" id="tab-chron" aria-selected="true">Chronicle</button><button type="button" role="tab" id="tab-ppl" aria-selected="false">Peoples</button><button type="button" role="tab" id="tab-tg" aria-selected="false">Tongues</button><button type="button" role="tab" id="tab-alm" aria-selected="false">Almanac</button></div>
        <ol id="log"></ol>
        <div id="roster" hidden></div>
        <div id="almanac" hidden></div>
        <div id="tongues" hidden></div>
      </section>
    </aside>
  </div>
</div>
<!--/APP-->
<script type="module" src="src/app.js"></script>
</body>
</html>
