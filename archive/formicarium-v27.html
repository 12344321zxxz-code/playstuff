<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>[hidden]{display:none!important}</style></head><body>
<title>Formicarium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: the map is the one framed object and takes all the room it can; powers sit on a rail to
   its left, the keeper's notebook to its right. Narrow screens stack: map, powers, notebook. */
:root{
  --ground:#e3e8e1; --panel:#eef2ec; --ink:#1c2924; --muted:#566860; --line:#c2ccc4; --press:#d6ddd5;
  --accent:#dba51f; --accent-ink:#1c2924; --frame:#101418;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#111815; --panel:#18221e; --ink:#dde6de; --muted:#8fa197; --line:#2b3a33; --press:#22302a;
  --accent:#e5b53f; --accent-ink:#141c19; --frame:#07090b; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#111815; --panel:#18221e; --ink:#dde6de; --muted:#8fa197; --line:#2b3a33; --press:#22302a;
  --accent:#e5b53f; --accent-ink:#141c19; --frame:#07090b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.42}
.app{height:100%;max-width:2000px;margin-inline:auto;padding-inline:16px;padding-block:10px 14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.4vw,30px);line-height:1;letter-spacing:-0.02em;margin:0}
.clock{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.lab,.gl,h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#yr{font-size:20px;font-weight:500;min-width:3.5ch}
.muted{color:var(--muted)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;line-height:1.2}
button:hover{background:var(--press)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[aria-pressed="true"],button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:flex;flex-wrap:wrap}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.lensrow{display:flex;align-items:center;gap:8px}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:168px minmax(0,1fr) 300px;gap:14px}
.tools{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;padding-right:2px}
.grp{display:flex;flex-direction:column;gap:5px}
.gb{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.gb button{text-align:left;padding:6px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brush .gb{grid-template-columns:repeat(4,1fr)}
.brush .gb button{text-align:center;padding-inline:0}
.opts .gb button{font-size:12.5px;padding:5px 7px}
.grp[hidden]{display:none}
.mapcol{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.jar{position:relative;flex:1;min-height:260px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--frame)}
.jar canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:grab}
.zoomer{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoomer button{width:34px;height:34px;padding:0;font-size:18px;background:color-mix(in srgb,var(--panel) 88%,transparent)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:#dde6de;padding:24px;text-align:center}
.nogl[hidden]{display:none}
#making{background:var(--frame);font-family:var(--display);font-size:20px}
.legend{position:absolute;left:10px;bottom:10px;padding:7px 10px 8px;border-radius:8px;background:rgba(16,20,24,.78);color:#e8ede9;font-size:12px;line-height:1.3;min-width:180px;pointer-events:none;backdrop-filter:blur(4px)}
.legend[hidden],.tip[hidden]{display:none}
.legend b{display:block;font-weight:600;margin-bottom:5px;letter-spacing:.02em}
.legend .bar{height:9px;border-radius:3px;margin-bottom:3px}
.legend .ends{display:flex;justify-content:space-between;color:#b9c4bd;font-size:11px}
.legend .keys{display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:hidden}
.legend .key{display:flex;align-items:center;gap:7px}.legend .key i{width:10px;height:10px;border-radius:2px;flex:none}
.tip{position:absolute;pointer-events:none;padding:4px 8px;border-radius:6px;background:rgba(16,20,24,.86);color:#f1f4f2;font-size:12.5px;font-weight:600;white-space:nowrap;transform:translate(14px,14px)}
.tip span{font-weight:400;color:#b9c4bd}
.toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;width:min(460px,calc(100% - 80px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:9px;align-items:baseline;text-align:left;padding:8px 12px;border-radius:9px;border:0;background:rgba(16,20,24,.86);color:#f1f4f2;font-size:13.5px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:tin .35s ease-out}
.toast:hover{background:rgba(26,32,38,.92)}
.toast .y{font-family:var(--mono);font-size:11.5px;color:#b9c4bd;flex:none}
.toast .chip{flex:none;align-self:center;margin:0}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.hint{margin:0;min-height:1.42em}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;overflow-y:auto}
.card{border-top:1px solid var(--line);padding-top:10px}
.card:first-child{border-top:0;padding-top:0}
.trend{margin-top:8px;display:flex;flex-direction:column;gap:3px}
#spark{width:100%;height:40px;display:block}
.dial{display:grid;grid-template-columns:64px minmax(0,1fr) 78px;gap:8px;align-items:center;margin-top:6px}
.dial input{width:100%;accent-color:var(--accent)}
.dial output{color:var(--muted);font-size:12.5px;text-align:right}
.mini{padding:3px 8px;justify-self:start}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px}
.vit{display:flex;flex-direction:column;min-width:0}
.vit .num{font-size:15px;font-weight:500}
.side>.card{flex-shrink:0}
.inspect{min-height:112px;max-height:236px;overflow-y:auto}
.inspect h3{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;margin:0 0 5px;text-wrap:balance}
.inspect p{margin:0 0 3px}
.inspect .sub{color:var(--muted);margin:-3px 0 7px;font-size:13px}
.inspect .part{margin:9px 0 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:2px 0 4px;gap:1px}
.fbar i{display:block;min-width:2px}
.fkey{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted);margin-bottom:7px}
.fkey span{display:inline-flex;align-items:center;gap:5px}.fkey i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;border:1px solid var(--ink);flex:none}
.chip.none{background:transparent;border-color:var(--line)}
.side>.book{flex:1 1 220px;min-height:220px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{padding:4px 8px}
#log{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;flex:1}
#log li.muted{padding:4px 0}
.ev{display:grid;grid-template-columns:4.4ch 10px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:4px 4px 4px 0}
.ev:disabled{cursor:default;color:var(--ink)}
.ev:disabled:hover{background:none}
.ev .y{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);text-align:right}
.ev .chip{margin:0;width:8px;height:8px;align-self:center}
.ev.pg{color:var(--muted);font-style:italic}
.ev.big{font-weight:600}
.ev.dg{border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;color:var(--muted);padding-block:7px;margin-block:4px}
#roster{overflow-y:auto;min-height:0;flex:1}
#roster[hidden]{display:none}
.pp{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 2px}
.pp .chip{margin:0;align-self:center}
.pp .nm{font-weight:600}
.pp .sub{grid-column:2/4;color:var(--muted);font-size:12.5px}
.gone{margin:8px 0 0;color:var(--muted);font-size:12.5px}
#log[hidden],#almanac[hidden]{display:none}
#almanac{overflow-y:auto;min-height:0;flex:1}
.alm-h{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px}
.alm{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:4px}
.alm button{text-align:left;padding:6px 8px;font-size:13px}
.alm .blank{border:1px dashed var(--line);border-radius:6px;padding:6px 8px;color:var(--muted);font-family:var(--mono);font-size:12px}
@media (max-width:1100px){
  html,body{height:auto}
  .app{height:auto}
  .stage{display:flex;flex-direction:column}
  .mapcol{order:1}.tools{order:2;overflow:visible}.side{order:3;overflow:visible}
  .jar{flex:none;height:min(72vh,calc((100vw - 32px) * 0.62))}
  .gb{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  #log,#almanac,#roster{max-height:320px}
}

/* world report */
.reportbox { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100vw - 32px)); height: min(70vh, 640px); display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--panel, #1b1d22); color: var(--ink, #eee); border: 1px solid var(--line, #444); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.reportbox[hidden] { display: none; }
.reportbox .rb-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.reportbox .rb-head span { opacity: .7; font-size: 12px; }
.reportbox textarea { flex: 1; min-height: 0; resize: none; font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,.25); color: inherit; border: 1px solid var(--line, #444); border-radius: 6px; padding: 8px; white-space: pre; overflow: auto; }
.reportbox .rb-btns { display: flex; gap: 8px; justify-content: flex-end; }
#log li { position: relative; }
#log li .why { position: absolute; right: 4px; top: 4px; font-size: 10px; padding: 1px 6px; border-radius: 9px; opacity: .75; }
#log li .why:hover { opacity: 1; }
.banner { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; max-width: min(640px, calc(100% - 32px)); padding: 8px 12px; border-radius: 8px; background: rgba(16,18,22,.86); color: #f3efe4; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.banner[hidden] { display: none; }
.banner .bgo { flex: none; }
.watching { background: none; border: none; color: inherit; opacity: .75; font-size: 12px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; padding: 0 6px; }
.watching:disabled { cursor: default; }
.card.keep { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; padding-bottom: 8px; }
.keeprow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.keeprow .lab { margin-right: auto; }
.keeprow button { padding: 3px 10px; font-size: 13px; }
.card.keep .watching { text-align: left; max-width: none; padding: 0; min-height: 1.2em; }
#log li:has(.why) .ev { padding-right: 40px; }
.tg{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:2px 8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 6px;font:inherit;color:inherit;cursor:pointer}
.tg:hover{background:var(--hover,rgba(127,127,127,.08))}
.tg .chip{margin:0;align-self:center}
.tg .nm{font-weight:600}
.tg.dead .nm{font-weight:400;text-decoration:line-through;opacity:.6}
.tg .num{font-variant-numeric:tabular-nums;font-size:.85em}
.pp .strip{grid-column:2 / -1;width:120px;height:18px;opacity:.9}
.records{margin:6px 0 10px}.records .rec{margin:2px 0;font-size:.9em}
.threads{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.thread{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;font:inherit;font-size:.88em;text-align:left;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:inherit}
.thread .tq{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.thread .pin{background:none;border:0;padding:0 2px;font:inherit;color:inherit;cursor:pointer}
.story{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 2px;font:inherit;color:inherit;cursor:pointer}
.story .y{font-variant-numeric:tabular-nums;font-size:.85em;opacity:.7}
.story .se{grid-column:2 / -1;font-style:italic}
.thread canvas{width:60px;height:14px}
.thread.ended{opacity:.65;font-style:italic;cursor:default}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Formicarium</h1></div>
    <div class="clock"><span class="lab">Year</span><span id="yr" class="num">0</span></div>
    <div class="seg" role="group" aria-label="Speed"><button type="button" id="sp0">Pause</button><button type="button" id="sp1" title="About two years a second, slowing down when something big is about to happen">Watchful</button><button type="button" id="sp2" title="Four years a second">Steady</button><button type="button" id="sp3" title="Twelve years a second">Fast</button></div>
    <div class="lensrow"><span class="lab">Lens</span><div class="seg" id="lenses" role="group" aria-label="Map lens"></div></div>
    <button type="button" id="newworld">New world</button><button type="button" id="emptyworld" title="A new world with no people in it">Empty world</button>
  </header>
  <div class="stage">
    <nav class="tools" id="tools" aria-label="Powers"></nav>
    <div class="mapcol">
      <div class="jar" id="jar"><canvas id="gl"></canvas><canvas id="ov" aria-label="The world. Drag to move, scroll to zoom, or pick a power and use it on the map."></canvas>
        <div class="zoomer"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button></div>
        <p class="nogl" id="nogl" hidden>This needs WebGL2, which this browser is not offering.</p>
        <p class="nogl" id="making">Making a world…</p>
        <div class="legend" id="legend" hidden></div>
        <div class="tip" id="tip" hidden></div>
        <div class="toasts" id="toasts" aria-live="polite"></div>
        <div class="banner" id="banner" hidden role="status"><span class="bt"></span><button type="button" class="bgo">Show me</button></div>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </div>
    <aside class="side">
      <section class="card keep" aria-label="This world"><div class="keeprow" id="keeprow"><span class="lab">This world</span></div><button type="button" id="watching" class="watching" disabled></button><div id="threads" class="threads" aria-label="Story threads"></div></section>
      <section class="card" aria-label="The sky">
        <h2>The sky</h2>
        <label class="dial"><span>Sun</span><input type="range" id="d-sun" min="-35" max="35" step="0.5" value="0"><output id="o-sun">as it is</output></label>
        <label class="dial"><span>Seasons</span><input type="range" id="d-tilt" min="0" max="85" step="0.5" value="23.5"><output id="o-tilt">mild</output></label>
        <label class="dial"><span>Sea level</span><input type="range" id="d-sea" min="-0.4" max="0.4" step="0.005" value="0"><output id="o-sea">as it is</output></label>
        <label class="dial"><span>Weather</span><input type="range" id="d-mood" min="0" max="4" step="0.1" value="1"><output id="o-mood">fickle</output></label>
        <label class="dial"><span>Rainfall</span><input type="range" id="d-wet" min="0.15" max="3" step="0.05" value="1"><output id="o-wet">as it is</output></label>
        <label class="dial"><span>Greenhouse</span><input type="range" id="d-green" min="-15" max="25" step="0.5" value="0"><output id="o-green">none</output></label>
        <label class="dial"><span>Spin</span><button type="button" id="d-spin" class="mini">Eastward</button><output></output></label>
      </section>
      <section class="card" aria-label="Living things"><div class="vitals" id="vitals"></div><div class="trend"><span class="lab">People over time</span><canvas id="spark" width="600" height="80" role="img" aria-label="World population over time"></canvas></div></section>
      <section class="card inspect" id="inspect" aria-live="polite"></section>
      <section class="card book">
        <div class="tabs" role="tablist"><button type="button" role="tab" id="tab-chron" aria-selected="true">Chronicle</button><button type="button" role="tab" id="tab-ppl" aria-selected="false">Peoples</button><button type="button" role="tab" id="tab-st" aria-selected="false">Stories</button><button type="button" role="tab" id="tab-tg" aria-selected="false">Tongues</button><button type="button" role="tab" id="tab-alm" aria-selected="false">Almanac</button></div>
        <ol id="log"></ol>
        <div id="roster" hidden></div>
        <div id="almanac" hidden></div>
        <div id="tongues" hidden></div>
        <div id="stories" hidden></div>
      </section>
    </aside>
  </div>
</div>
